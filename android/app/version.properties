# Single source of truth for the Android app version.
#
# versionCode  integer Play uses to order releases. It must increase by at
#              least 1 for every artifact uploaded to Play, and can never be
#              reused or lowered.
# versionName  human-readable string shown in the Play listing and in the app.
#
# Bumping a release is an edit to this file and nothing else.
versionCode=1
versionName=1.0.0
